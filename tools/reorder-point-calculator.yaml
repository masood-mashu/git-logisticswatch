name: reorder-point-calculator
description: "Calculates safety stock and economic reorder point where ROP is Daily Usage times Lead Time plus Safety Stock"
version: 1.0.0
input_schema:
  type: object
  properties:
    daily_usage_units:
      type: string
      description: "Average daily component usage in units"
  required:
    - daily_usage_units
implementation:
  type: script
  path: reorder_point_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
