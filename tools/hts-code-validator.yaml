name: hts-code-validator
description: "Validates that international trade components specify a valid 6-digit HTS tariff code"
version: 1.0.0
input_schema:
  type: object
  properties:
    hts_code:
      type: string
      description: "Harmonized Tariff Schedule code string"
  required:
    - hts_code
implementation:
  type: script
  path: hts_code_validator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
